
name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            zip \
            unzip \
            libtool \
            autoconf \
            libncurses5 \
            libncursesw5 \
            zlib1g-dev \
            libssl-dev \
            libffi-dev \
            cmake
          
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install Cython==0.29.33 buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrensesEngine-OpenCV
          path: bin/*.apk
