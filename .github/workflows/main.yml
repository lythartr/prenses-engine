title = Prenses Engine Pro
package.name = prensesengine
package.domain = org.efendim
source.dir = .
source.include_exts = py,png,jpg,kv,atlas
version = 1.0

# Gereksinimler: OpenCV (opencv4android) eklendi
requirements = python3,kivy==2.2.1,kivymd==1.1.1,pillow,sdl2_ttf,opencv4android

orientation = portrait
fullscreen = 1

# İzinler: Yüz tanıma ve hareket algılama için kamera şart
android.permissions = CAMERA, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE, MANAGE_EXTERNAL_STORAGE

# Android mimarisi (Güncel telefonlar için)
android.archs = arm64-v8a
android.allow_backup = True
android.accept_sdk_license = True

# NDK ve SDK (Hata almamak için sabitliyoruz)
android.ndk = 25b
android.api = 33
